# Server Configuration
server.port=${PORT:8081}
server.servlet.context-path=/

# MySQL Database Configuration
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/studywise_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA & Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

# SQL Init (Set to always if you want to execute data.sql on startup)
spring.sql.init.mode=never
spring.jpa.defer-datasource-initialization=true

# JWT Security Configuration
# 256-bit base64-encoded secret key or raw secure string (min 256 bits)
application.security.jwt.secret-key=${JWT_SECRET}
application.security.jwt.expiration=86400000

# CORS Configuration
application.cors.allowed-origins=http://localhost:5173,http://127.0.0.1:5173,http://localhost:4173,http://127.0.0.1:4173,https://samunuru-loki.github.io
# Logging Configuration
logging.level.com.studywise=DEBUG
logging.level.org.springframework.security=INFO
logging.level.org.hibernate.SQL=DEBUG
